<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#grad)"/>

  <!-- Bridge Icon -->
  <g transform="translate(256, 256)">
    <!-- Left pillar -->
    <rect x="-180" y="-40" width="40" height="120" fill="#fff" rx="5"/>
    <!-- Right pillar -->
    <rect x="140" y="-40" width="40" height="120" fill="#fff" rx="5"/>

    <!-- Bridge arch -->
    <path d="M -160 -40 Q 0 -120, 160 -40" stroke="#fff" stroke-width="35" fill="none" stroke-linecap="round"/>

    <!-- Bridge deck -->
    <rect x="-180" y="-20" width="360" height="25" fill="#fff" rx="5"/>

    <!-- Connection lines -->
    <line x1="-120" y1="-40" x2="-80" y2="-80" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <line x1="-40" y1="-40" x2="-20" y2="-95" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="-40" x2="20" y2="-95" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="-40" x2="80" y2="-80" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sharing arrows -->
  <g transform="translate(256, 350)">
    <!-- Left arrow -->
    <path d="M -60 0 L -20 0 L -20 -15 L 0 10 L -20 35 L -20 20 L -60 20 Z" fill="#fff" opacity="0.9"/>
    <!-- Right arrow -->
    <path d="M 60 20 L 20 20 L 20 35 L 0 10 L 20 -15 L 20 0 L 60 0 Z" fill="#fff" opacity="0.9"/>
  </g>
</svg>
