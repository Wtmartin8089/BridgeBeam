<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgeBeam - Cross-Platform File Sharing</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="theme-color" content="#0d6efd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Secure file sharing between Android and iPhone" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: #f0f0f0;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .file-input-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .file-input-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .file-input-area.dragover {
            background: #f0f0ff;
            border-color: #764ba2;
        }

        input[type="file"] {
            display: none;
        }

        .file-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .connection-code {
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .code-display {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 5px;
            margin: 10px 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.5em;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            font-weight: bold;
            color: #333;
        }

        .file-size {
            font-size: 0.9em;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }

        .qr-code {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌉 BridgeBeam</h1>
        <p class="subtitle">Secure file sharing between any devices</p>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('send')">📤 Send</button>
            <button class="mode-btn" onclick="switchMode('receive')">📥 Receive</button>
        </div>

        <!-- Send Section -->
        <div id="send-section" class="section active">
            <div class="file-input-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="file-icon">📁</div>
                <p><strong>Click to select files</strong></p>
                <p style="color: #666; font-size: 0.9em; margin-top: 10px;">or drag and drop files here</p>
            </div>
            <input type="file" id="fileInput" multiple>

            <div id="selectedFiles" class="file-list"></div>

            <button class="btn" id="generateCodeBtn" onclick="generateConnectionCode()" disabled>
                Generate Connection Code
            </button>

            <div id="connectionCode" style="display: none;">
                <div class="connection-code">
                    <p>Share this code with the receiver:</p>
                    <div class="code-display" id="codeDisplay"></div>
                    <div class="qr-code" id="qrCode"></div>
                    <p style="color: #666; font-size: 0.9em; margin-top: 10px;">
                        Code expires in 5 minutes
                    </p>
                </div>
            </div>
        </div>

        <!-- Receive Section -->
        <div id="receive-section" class="section">
            <p style="text-align: center; margin-bottom: 20px; color: #666;">
                Enter the connection code from the sender:
            </p>

            <input type="text" id="codeInput" placeholder="XXXX" maxlength="4">

            <button class="btn" onclick="connectToSender()">Connect & Receive Files</button>

            <div id="receiveFiles" class="file-list"></div>
        </div>

        <div id="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        // Change this to your deployed signaling server URL for production
        const SIGNALING_SERVER = 'http://localhost:8000';
        const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
        const CHUNK_SIZE = 65536; // 64KB

        // Global state
        let selectedFiles = [];
        let connectionCode = null;
        let peerConnection = null;
        let dataChannel = null;
        let role = null; // 'sender' | 'receiver'
        let icePollIndex = 0;
        let icePollTimer = null;

        // Receiving state: fileIndex -> {meta, chunks, received}
        const receivingFiles = {};

        // --- File handling ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');

        fileInput.addEventListener('change', (e) => handleFiles(Array.from(e.target.files)));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(Array.from(e.dataTransfer.files));
        });

        function handleFiles(files) {
            selectedFiles = files;
            displaySelectedFiles();
            document.getElementById('generateCodeBtn').disabled = files.length === 0;
        }

        function displaySelectedFiles() {
            const container = document.getElementById('selectedFiles');
            container.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                    </div>
                    <button onclick="removeFile(${index})" style="background:#ff5252;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;">✕</button>
                `;
                container.appendChild(item);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displaySelectedFiles();
            document.getElementById('generateCodeBtn').disabled = selectedFiles.length === 0;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // --- Mode switching ---
        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(`${mode}-section`).classList.add('active');
            clearStatus();
        }

        // --- WebRTC helpers ---
        function createPeerConnection() {
            const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

            pc.onicecandidate = async (event) => {
                if (!event.candidate) return;
                try {
                    await fetch(`${SIGNALING_SERVER}/api/session/${connectionCode}/ice/${role}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            candidate: event.candidate.candidate,
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                        }),
                    });
                } catch (e) { console.warn('ICE send error', e); }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed') {
                    showStatus('Connection failed. Please try again.', 'error');
                }
            };

            return pc;
        }

        async function pollIce(fromRole) {
            try {
                const res = await fetch(`${SIGNALING_SERVER}/api/session/${connectionCode}/ice/${fromRole}?after=${icePollIndex}`);
                if (!res.ok) return;
                const data = await res.json();
                for (const c of data.candidates) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); }
                    catch (e) { console.warn('addIceCandidate failed', e); }
                }
                icePollIndex = data.total;
            } catch (e) { /* network blip, will retry */ }
        }

        // --- Sender flow ---
        async function generateConnectionCode() {
            // Create session on server
            let data;
            try {
                const res = await fetch(`${SIGNALING_SERVER}/api/session`, { method: 'POST' });
                data = await res.json();
            } catch (e) {
                showStatus('Cannot reach signaling server. Is the backend running?', 'error');
                return;
            }

            connectionCode = data.code;
            role = 'sender';

            document.getElementById('codeDisplay').textContent = connectionCode;
            document.getElementById('connectionCode').style.display = 'block';

            const qrContainer = document.getElementById('qrCode');
            qrContainer.innerHTML = '';
            QRCode.toCanvas(
                document.createElement('canvas'),
                `${window.location.origin}?code=${connectionCode}`,
                { width: 200 },
                (err, canvas) => { if (!err) qrContainer.appendChild(canvas); }
            );

            // Create peer connection, data channel, and offer
            peerConnection = createPeerConnection();
            dataChannel = peerConnection.createDataChannel('files');
            setupSenderChannel(dataChannel);

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await fetch(`${SIGNALING_SERVER}/api/session/${connectionCode}/offer`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: offer.sdp, type: offer.type }),
            });

            showStatus('Waiting for receiver to connect...', 'info');

            // Poll for answer SDP
            const answerPoll = setInterval(async () => {
                try {
                    const res = await fetch(`${SIGNALING_SERVER}/api/session/${connectionCode}/answer`);
                    if (res.ok) {
                        const answer = await res.json();
                        clearInterval(answerPoll);
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                        // Start polling for receiver's ICE candidates
                        icePollIndex = 0;
                        icePollTimer = setInterval(() => pollIce('receiver'), 1000);
                    }
                } catch (e) { /* still waiting */ }
            }, 1000);

            setTimeout(() => {
                clearInterval(answerPoll);
                if (!dataChannel || dataChannel.readyState !== 'open') {
                    showStatus('Connection timeout. Please try again.', 'error');
                }
            }, 300000);
        }

        function setupSenderChannel(dc) {
            dc.onopen = () => {
                clearInterval(icePollTimer);
                showStatus('Receiver connected! Sending files...', 'success');
                sendAllFiles();
            };
            dc.onerror = (e) => showStatus('Transfer error: ' + e.message, 'error');
        }

        async function sendAllFiles() {
            for (let i = 0; i < selectedFiles.length; i++) {
                await sendFile(selectedFiles[i], i);
            }
            showStatus('All files sent successfully!', 'success');
            dataChannel.close();
        }

        function sendFile(file, fileIndex) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const buffer = e.target.result;
                    const totalChunks = Math.ceil(buffer.byteLength / CHUNK_SIZE);

                    // Send metadata first
                    dataChannel.send(JSON.stringify({
                        type: 'meta',
                        name: file.name,
                        size: file.size,
                        mimeType: file.type,
                        totalChunks,
                        fileIndex,
                    }));

                    for (let chunk = 0; chunk < totalChunks; chunk++) {
                        // Backpressure: wait if buffer is too full
                        while (dataChannel.bufferedAmount > CHUNK_SIZE * 8) {
                            await new Promise(r => setTimeout(r, 50));
                        }
                        const start = chunk * CHUNK_SIZE;
                        dataChannel.send(buffer.slice(start, start + CHUNK_SIZE));
                    }
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // --- Receiver flow ---
        async function connectToSender() {
            const code = document.getElementById('codeInput').value.toUpperCase().trim();
            if (code.length !== 4) {
                showStatus('Please enter a valid 4-character code', 'error');
                return;
            }

            connectionCode = code;
            role = 'receiver';
            showStatus('Connecting...', 'info');

            let offer;
            try {
                const res = await fetch(`${SIGNALING_SERVER}/api/session/${code}/offer`);
                if (!res.ok) {
                    showStatus('Invalid or expired code. Please try again.', 'error');
                    return;
                }
                offer = await res.json();
            } catch (e) {
                showStatus('Cannot reach signaling server.', 'error');
                return;
            }

            peerConnection = createPeerConnection();
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupReceiverChannel(dataChannel);
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await fetch(`${SIGNALING_SERVER}/api/session/${code}/answer`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: answer.sdp, type: answer.type }),
            });

            showStatus('Connected! Waiting for files...', 'info');

            // Poll for sender's ICE candidates
            icePollIndex = 0;
            icePollTimer = setInterval(() => pollIce('sender'), 1000);
        }

        function setupReceiverChannel(dc) {
            dc.onopen = () => {
                clearInterval(icePollTimer);
                showStatus('Transfer started!', 'info');
            };

            dc.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    // Metadata frame
                    const meta = JSON.parse(event.data);
                    if (meta.type === 'meta') {
                        receivingFiles[meta.fileIndex] = { meta, chunks: [], received: 0 };
                        showIncomingFile(meta);
                    }
                } else {
                    // Binary chunk — assign to the last incomplete file
                    const activeIdx = Object.keys(receivingFiles)
                        .map(Number)
                        .find(idx => receivingFiles[idx].received < receivingFiles[idx].meta.totalChunks);

                    if (activeIdx === undefined) return;

                    const f = receivingFiles[activeIdx];
                    f.chunks.push(event.data);
                    f.received++;

                    const pct = Math.round(f.received / f.meta.totalChunks * 100);
                    const bar = document.getElementById(`progress-${activeIdx}`);
                    if (bar) bar.style.width = pct + '%';

                    if (f.received === f.meta.totalChunks) {
                        downloadFile(activeIdx);
                    }
                }
            };

            dc.onclose = () => showStatus('All files received!', 'success');
        }

        function showIncomingFile(meta) {
            const container = document.getElementById('receiveFiles');
            if (!container.querySelector('p')) {
                container.innerHTML = '<p style="margin-bottom:15px;font-weight:bold;">Incoming files:</p>';
            }
            const item = document.createElement('div');
            item.className = 'file-item';
            item.id = `file-item-${meta.fileIndex}`;
            item.innerHTML = `
                <div class="file-info">
                    <div class="file-name">${meta.name}</div>
                    <div class="file-size">${formatFileSize(meta.size)}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-${meta.fileIndex}" style="width:0%"></div>
                    </div>
                </div>
            `;
            container.appendChild(item);
        }

        function downloadFile(fileIndex) {
            const f = receivingFiles[fileIndex];
            const blob = new Blob(f.chunks, { type: f.meta.mimeType || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = f.meta.name;
            a.click();
            URL.revokeObjectURL(url);

            const item = document.getElementById(`file-item-${fileIndex}`);
            if (item) item.style.background = '#e8f5e9';
        }

        // --- Status ---
        function showStatus(message, type = 'info') {
            const div = document.getElementById('status');
            div.className = `status ${type}`;
            div.textContent = message;
            div.style.display = 'block';
        }

        function clearStatus() {
            document.getElementById('status').style.display = 'none';
        }

        // --- Auto-fill code from URL (QR scan) ---
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                document.querySelectorAll('.mode-btn')[0].classList.remove('active');
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById('receive-section').classList.add('active');
                document.getElementById('codeInput').value = code;
            }
        });

        // --- Service Worker ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ Service Worker registered', reg))
                .catch(err => console.error('❌ Service Worker failed', err));
        }
    </script>
</body>
</html>
